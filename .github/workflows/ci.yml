---
name: CI

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  MISE_ENV: ci

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Configure Windows environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "HOME=$env:USERPROFILE" >> $env:GITHUB_ENV
          git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libfontconfig1-dev libfreetype6-dev libssl-dev \
            libudev-dev libwayland-dev libx11-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libvulkan-dev pkg-config
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          sudo bash /tmp/llvm.sh 23
          sudo apt-get install -y --no-install-recommends \
            clang-23 libclang-23-dev
          echo 'LIBCLANG_PATH=/usr/lib/llvm-23/lib' >> "$GITHUB_ENV"

      - uses: jdx/mise-action@v5
        with:
          experimental: true
          install: true
          cache: true

      - name: Check Linux LLVM alignment
        if: runner.os == 'Linux'
        run: |
          llvm_major="$(rustc -vV | \
            awk -F': ' '/^LLVM version:/ {split($2, v, "."); print v[1]}')"
          if [ "$llvm_major" != 23 ]; then
            echo "rustc LLVM $llvm_major does not match clang-23" >&2
            exit 1
          fi

      - name: Configure Windows native tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hostTriple = rustc -vV | Select-String '^host:'
          if ($hostTriple -notmatch 'x86_64-pc-windows-msvc') {
            throw "Expected Windows x64 Rust toolchain, got $hostTriple"
          }
          $llvmBin = Join-Path $env:ProgramFiles 'LLVM\bin'
          if (!(Test-Path "$llvmBin\clang.exe") -or
              !(Test-Path "$llvmBin\libclang.dll")) {
            throw "Windows runner is missing LLVM in $llvmBin"
          }
          $llvmBin >> $env:GITHUB_PATH
          "LIBCLANG_PATH=$llvmBin" >> $env:GITHUB_ENV

      - uses: Swatinem/rust-cache@v2

      - name: Install omp and jj
        run: |
          bun install --frozen-lockfile
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
          cargo binstall --no-confirm jj-cli
          git config --global user.name 'Alvin CI'
          git config --global user.email 'ci@example.invalid'

      - name: Cache speech model
        uses: actions/cache@v6
        with:
          path: ~/.cache/alvin/speech
          key: speech-model-${{ hashFiles('crates/alvin-stt/src/model.rs') }}
          enableCrossOsArchive: true

      - name: Verify
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo 'OPENROUTER_API_KEY is required for omp tests' >&2
            exit 1
          fi
          mise run --force verify

      - name: Check wasm client and protocol
        run: >-
          cargo check --locked --target wasm32-unknown-unknown
          -p alvin-client -p alvin-protocol
