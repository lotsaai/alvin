---
name: Prerelease

"on":
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

env:
  MISE_ENV: ci

jobs:
  build:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: alvin-aarch64-apple-darwin.zip
          - os: ubuntu-24.04
            artifact: alvin-x86_64-unknown-linux-gnu.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libfontconfig1-dev libfreetype6-dev libssl-dev \
            libudev-dev libwayland-dev libx11-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libvulkan-dev pkg-config
          curl -sSL https://apt.llvm.org/llvm.sh | sudo bash -s -- 23
          sudo apt-get install -y --no-install-recommends \
            clang-23 libclang-23-dev
      - uses: jdx/mise-action@v4
        with:
          experimental: true
          install: true
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.os }}
      - name: Build and package
        run: mise run package-release
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/distrib/${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish unsigned prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          CI_RUN: ${{ github.event.workflow_run.id }}
          CI_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum alvin-* > SHA256SUMS
          notes="Unsigned prerelease built from CI-verified commit ${SHA}."
          notes="${notes} macOS builds are not notarized."
          gh release create \
            "prerelease-${SHA}-${CI_RUN}-${CI_ATTEMPT}" alvin-* SHA256SUMS \
            --target "$SHA" --prerelease \
            --title "Prerelease ${SHA}" --notes "$notes"
