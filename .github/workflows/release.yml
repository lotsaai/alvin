---
name: Prerelease

"on":
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

env:
  MISE_ENV: ci

jobs:
  build:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: alvin-aarch64-apple-darwin.zip
          - os: ubuntu-24.04
            artifact: alvin-x86_64-unknown-linux-gnu.tar.gz
          - os: windows-latest
            artifact: alvin-x86_64-pc-windows-msvc.zip
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Configure Windows environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "HOME=$env:USERPROFILE" >> $env:GITHUB_ENV
          git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libfontconfig1-dev libfreetype6-dev libssl-dev \
            libudev-dev libwayland-dev libx11-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libvulkan-dev pkg-config
          curl -sSL https://apt.llvm.org/llvm.sh | sudo bash -s -- 23
          sudo apt-get install -y --no-install-recommends \
            clang-23 libclang-23-dev
      - name: Install Windows native dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install pkgconfiglite --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pkg-config --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pkg-config --list-all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: jdx/mise-action@v5
        with:
          experimental: true
          install: true
          cache: true
      - name: Configure Windows native tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hostTriple = rustc -vV | Select-String '^host:'
          if ($hostTriple -notmatch 'x86_64-pc-windows-msvc') {
            throw "Expected Windows x64 Rust toolchain, got $hostTriple"
          }
          $llvmBin = Join-Path $env:ProgramFiles 'LLVM\bin'
          if (!(Test-Path "$llvmBin\clang.exe") -or
              !(Test-Path "$llvmBin\libclang.dll")) {
            throw "Windows runner is missing LLVM in $llvmBin"
          }
          $llvmBin >> $env:GITHUB_PATH
          "LIBCLANG_PATH=$llvmBin" >> $env:GITHUB_ENV

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.os }}
      - name: Build and package
        run: mise run package-release
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: target/distrib/${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish unsigned prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          CI_RUN: ${{ github.event.workflow_run.id }}
          CI_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum alvin-* > SHA256SUMS
          notes="Unsigned prerelease built from CI-verified commit ${SHA}."
          notes="${notes} macOS builds are not notarized."
          notes="${notes} Windows builds are unsigned and require the current"
          notes="${notes} Microsoft Visual C++ v14 Redistributable:"
          notes="${notes} https://aka.ms/vc14/vc_redist.x64.exe."
          gh release create \
            "prerelease-${SHA}-${CI_RUN}-${CI_ATTEMPT}" alvin-* SHA256SUMS \
            --target "$SHA" --prerelease \
            --title "Prerelease ${SHA}" --notes "$notes"
