hakari-package = "alvin-workspace-hack"
dep-format-version = "4"
resolver = "2"

platforms = ["aarch64-apple-darwin", "x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]

# alvin-protocol, alvin-client and alvin-conversation are the wasm32 boundary. The hack crate unifies the gateway's native features
# (tokio `net` pulls in mio, which does not build for wasm32; jsonrpsee `server`), so these stay out of its
# graph and never depend on it.
[traversal-excludes]
workspace-members = ["alvin-protocol", "alvin-client", "alvin-conversation"]
