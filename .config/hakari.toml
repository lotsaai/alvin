hakari-package = "alvin-workspace-hack"
dep-format-version = "4"
resolver = "2"

platforms = ["aarch64-apple-darwin", "x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]

# Client-facing crates stay outside gateway feature unification.
# The shared telemetry pipeline must not pull the server feature graph into the desktop.
[traversal-excludes]
workspace-members = ["alvin-protocol", "alvin-client", "alvin-conversation", "alvin-conversation-ui", "alvin-app", "alvin-telemetry"]
