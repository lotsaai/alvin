[profile.default]
# Every test talks to real omp and finishes in seconds. A test over 1 minute is reported as slow, and over 2 minutes it is hung: nextest kills it.
slow-timeout = { period = "1m", terminate-after = 2 }

[profile.default.junit]
path = "junit.xml"

[profile.ci]
fail-fast = false

[profile.ci.junit]
path = "junit.xml"

# Each of these tests starts a real omp process, which costs CPU and a model call. Started all at once they starve
# each other, so at most four run at a time.
[test-groups]
omp = { max-threads = 4 }
speech-model = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'test(transcribes_real_audio_twice) | test(dictation_streams_into_an_editable_undoable_draft) | test(navigation_and_shutdown_cancel_dictation) | test(opening_settings_cancels_pending_dictation_and_preserves_draft)'
test-group = 'speech-model'

[[profile.default.overrides]]
filter = 'package(alvin-gateway) | package(alvin-omp-host) | package(alvin-session-index) | package(alvin-app)'
test-group = 'omp'
