[package]
name = "alvin-workspace-hack"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "workspace-hack package, managed by hakari"

# To remove these dependencies, omit this crate from your workspace's `members`
# list in the root Cargo.toml.

### BEGIN HAKARI SECTION
[dependencies]
aho-corasick = { version = "1" }
log = { version = "0.4", default-features = false, features = ["std"] }
memchr = { version = "2" }
regex-automata = { version = "0.4", default-features = false, features = ["dfa-build", "dfa-onepass", "hybrid", "meta", "nfa", "perf", "std"] }
serde = { version = "1", features = ["alloc", "derive"] }
serde_core = { version = "1", default-features = false, features = ["alloc", "result", "std"] }
serde_json = { version = "1", features = ["alloc", "raw_value"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml_parser = { version = "1" }
tracing-core = { version = "0.1" }
winnow = { version = "1" }

[target.x86_64-pc-windows-msvc.dependencies]
windows-sys = { version = "0.61", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Wdk_System_IO", "Win32_Globalization", "Win32_Networking_WinSock", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Console", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_WindowsProgramming", "Win32_UI_Shell"] }

[build-dependencies]
cc = { version = "1", default-features = false, features = ["parallel"] }
proc-macro2 = { version = "1" }
quote = { version = "1" }
syn-7b89eefb6aaa9bf3 = { package = "syn", version = "3", features = ["extra-traits", "fold", "full", "visit", "visit-mut"] }
syn-f595c2ba2a3f28df = { package = "syn", version = "2", features = ["extra-traits", "full", "visit", "visit-mut"] }
toml_parser = { version = "1" }
winnow = { version = "1" }

### END HAKARI SECTION
