[package]
name = "alvin-workspace-hack"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "workspace-hack package, managed by hakari"

# To remove these dependencies, omit this crate from your workspace's `members`
# list in the root Cargo.toml.

### BEGIN HAKARI SECTION
[dependencies]
memchr = { version = "2" }

[build-dependencies]
proc-macro2 = { version = "1" }
quote = { version = "1" }
syn = { version = "3", features = ["extra-traits", "fold", "visit"] }

[target.wasm32-unknown-unknown.build-dependencies]
syn = { version = "3", default-features = false, features = ["full", "visit-mut"] }

### END HAKARI SECTION
