[package]
name = "alvin-omp-host"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Supervises one omp --mode rpc-ui process per live session"

[dependencies]
alvin-protocol = { version = "0.1.0", path = "../alvin-protocol" }
alvin-workspace-hack = { version = "0.1", path = "../alvin-workspace-hack" }
omp-rpc = { git = "https://github.com/can1357/oh-my-pi", tag = "v18.18.1", version = "0.1.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["io-util", "process", "rt", "sync", "time"] }
tracing = "0.1.44"
typed-builder = "0.23.2"

[target."cfg(unix)".dependencies]
rustix = { version = "1.1.6", features = ["process"] }

[target."cfg(windows)".dependencies]
win32job = "2.0.3"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread"] }
