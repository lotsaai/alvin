[package]
name = "alvin-client"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Typed alvin client; the transport is picked by endpoint"

[dependencies]
alvin-protocol = { version = "0.1.0", path = "../alvin-protocol" }
alvin-workspace-hack = { version = "0.1.0", path = "../alvin-workspace-hack", default-features = false }
jsonrpsee = { version = "0.26.1", default-features = false, features = ["client-core", "macros"] }
serde = "1.0.229"
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync"] }
url = "2.5.8"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
jsonrpsee = { version = "0.26.1", default-features = false, features = ["ws-client", "client-ws-transport-tls", "async-client"] }
tokio = { version = "1.54.1", features = ["time"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
jsonrpsee = { version = "0.26.1", default-features = false, features = ["wasm-client", "async-wasm-client"] }
