[package]
name = "alvin-conversation-ui"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "gpui-kit views over alvin-conversation state"

[dependencies]
alvin-client = { version = "0.1.0", path = "../alvin-client" }
alvin-conversation = { version = "0.1.0", path = "../alvin-conversation" }
alvin-protocol = { version = "0.1.0", path = "../alvin-protocol" }
alvin-stt = { version = "0.1.0", path = "../alvin-stt" }
anstyle-parse = "1.0.0"
async-channel = "2.5.0"
base64 = "0.23.1"
ghostty-vt = "0.8.0"
gpui-kit = { version = "0.9.0", features = ["speech"] }
lsp-types = "0.97.0"
palate = "0.3.9"
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"
verdant = { git = "https://github.com/casualjim/verdant", branch = "main-git-deploy", version = "0.7.3" }
verdant-parsers-git = { git = "https://github.com/casualjim/verdant", branch = "main-git-deploy", version = "0.7.3", features = ["markdown", "markdown_inline", "some"] }

[dev-dependencies]
alvin-gateway = { path = "../alvin-gateway" }
alvin-omp-host = { path = "../alvin-omp-host" }
gpui-kit = { version = "0.9.0", features = ["test-support"] }
hound = "3.5.1"
tempfile = "3.23.0"
test-context = "0.5.8"
tokio = { version = "1.54.1", features = ["rt", "macros", "rt-multi-thread", "time"] }
