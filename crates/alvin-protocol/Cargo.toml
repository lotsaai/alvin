[package]
name = "alvin-protocol"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Wire contract between the alvin gateway and its clients"

[features]
server = ["jsonrpsee/server-core"]

[dependencies]
alvin-workspace-hack = { version = "0.1", path = "../alvin-workspace-hack" }
jiff = { version = "0.2.38", features = ["serde"] }
jsonrpsee = { version = "0.26.1", default-features = false, features = ["client-core", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
uuid = { version = "1.29.0", features = ["v7", "serde"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
uuid = { version = "1.29.0", features = ["js"] }
