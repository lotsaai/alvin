redactions = ["*_TOKEN", "*_SECRET", "*_KEY", "*_PASSWORD"]

[plugins]
fnox-env = "https://github.com/jdx/mise-env-fnox"

[settings]
experimental = true
lockfile = true
env_shell_expand = true
npm.package_manager = "bun"
idiomatic_version_file_enable_tools = ["rust"]
# rust.cargo_home =".cache/native/cargo"
# rust.rustup_home = ".cache/native/rustup"
python.uv_venv_auto = "create|source"

[tools]
"aqua:nextest-rs/nextest/cargo-nextest" = "latest"
"cargo:cargo-sort" = "latest"
hk = "latest"
node = "24"
bun = "latest"
pkl = "latest"
fnox = "latest"
taplo = "latest"
shellcheck = "latest"
cargo-binstall = "latest"
rust = { version = "latest", profile = "default", components = "llvm-tools,rust-analyzer", targets = "aarch64-apple-darwin,wasm32-unknown-unknown" }
"cargo:cargo-hakari" = "latest"
"github:casualjim/remark" = "latest"
uv = "latest"
python = "3.14"
yamllint = "latest"
watchexec = "latest"
pitchfork = { version = "latest", workflow = "release.yml@refs/heads/main" }
shfmt = "latest"
zig = "latest"
"cargo:docsrs-mcp" = "latest"

[daemons.gateway]
task = "gateway"
ready_port = 7410
watch = [
  "Cargo.toml",
  "Cargo.lock",
  "crates/alvin-gateway/**/*.rs",
  "crates/alvin-gateway/Cargo.toml",
  "crates/alvin-omp-host/**/*.rs",
  "crates/alvin-omp-host/Cargo.toml",
  "crates/alvin-session-index/**/*.rs",
  "crates/alvin-session-index/Cargo.toml",
  "crates/alvin-protocol/**/*.rs",
  "crates/alvin-protocol/Cargo.toml",
  "crates/alvin-telemetry/**/*.rs",
  "crates/alvin-telemetry/Cargo.toml",
  "crates/alvin-workspace-hack/Cargo.toml",
  ".mise/tasks/gateway",
]

[env]
_.file = ".env"
_.fnox-env = { tools = true }
# _.path = ["{{ config_root }}/.cache/native/cargo/bin"]
CARGO_TERM_COLOR = "always"
REMARK_OSC52="1"
# CARGO_HOME="{{config_root}}/.cache/native/cargo"
# RUSTUP_HOME="{{config_root}}/.cache/native/rustup"
