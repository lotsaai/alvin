redactions = ["*_TOKEN", "*_SECRET", "*_KEY", "*_PASSWORD"]


[settings]
experimental = true
lockfile = true
env_shell_expand = true
npm.package_manager = "pnpm"
idiomatic_version_file_enable_tools = ["rust"]
# rust.cargo_home =".cache/native/cargo"
# rust.rustup_home = ".cache/native/rustup"
python.uv_venv_auto = "create|source"

[tools]
"aqua:nextest-rs/nextest/cargo-nextest" = "latest"
"cargo:cargo-sort" = "latest"
"go:github.com/sqlc-dev/sqlc/cmd/sqlc" = "latest"
hk = "latest"
node = "24"
pkl = "latest"
fnox = "latest"
taplo = "latest"
shellcheck = "latest"
cargo-binstall = "latest"
rust = { version = "latest", profile = "default", components = "llvm-tools,rust-analyzer", targets = "aarch64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim,aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android,wasm32-unknown-unknown" }
# "github:longbridge/nsh" = "0.3.0"
java = "latest"
"cargo:cargo-hakari" = "latest"
"github:casualjim/remark" = "latest"
uv = "latest"
python = "3.14"
yamllint = "latest"

# NSH CLI builds every runner (desktop, iOS, wasm) itself; its version pins the
# nsh-core/nsh-base crates the app crate depends on (mise.lock holds both).
[env]
_.file = ".env"
# _.fnox-env = { tools = true }
# _.path = ["{{ config_root }}/.cache/native/cargo/bin"]
CARGO_TERM_COLOR = "always"
REMARK_OSC52="1"
# CARGO_HOME="{{config_root}}/.cache/native/cargo"
# RUSTUP_HOME="{{config_root}}/.cache/native/rustup"
